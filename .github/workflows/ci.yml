name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck tests
        run: pnpm run test:types

      - name: Lint (includes architecture import rules)
        run: pnpm run lint

      - name: Test (unit, integration, axe in jsdom)
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm --filter @workspace/travel-planner exec playwright install --with-deps chromium

      - name: End-to-end demo (390 and 1440, axe incl. contrast)
        run: pnpm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/travel-planner/playwright-report
          retention-days: 7
